<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Empresa - ChocoGourmet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #3e2723;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            padding: 40px;
            text-align: center;
            margin: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #795548;
            margin-bottom: 20px;
        }

        .logo {
            width: 180px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 2rem;
            color: #3e2723;
            margin: 10px 0;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #5d4037;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>Mi Empresa</h1>
        </header>

        <img src="logoempresa.jpeg" alt="Logotipo de ChocoGourmet" class="logo">
        
        <h2 class="brand-name">ChocoGourmet</h2>
        
        <p class="description">
            En <strong>ChocoGourmet</strong> nos dedicamos a la elaboración artesanal de bombones y chocolates finos de alta calidad. Fusionamos cacaos seleccionados con ingredientes naturales para ofrecer una experiencia gastronómica única y sofisticada.
        </p>
    </main>

</body>
</html>
